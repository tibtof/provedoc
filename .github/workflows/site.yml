name: site

# Versioned docs site (ADR-5 model): site root = latest release, /v/X.Y.Z/ =
# frozen snapshot built by THAT tag's own generator (so version diffs are real,
# tested behavioral differences), /next/ = main. The whole site is rebuilt
# statelessly on every run — no gh-pages branch state to corrupt. Cost grows
# ~1-2 min per release; if that ever hurts, switch to a stateful branch that
# only rebuilds the changed slice.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags, checked out individually below
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build every release with its own generator
        run: |
          set -euo pipefail
          mkdir -p build/pages
          TAGS=$(git tag -l 'v*' --sort=-v:refname)
          LATEST=$(echo "$TAGS" | head -1)
          # Flags accepted by every generator since v0.1.0; tags whose checkout
          # carries a tddoc.yml would work bare, but explicit flags keep the
          # oldest snapshots buildable too. Unknown flags are ignored by old
          # generators, so this list may grow safely.
          ARGS=(--docs src/test/java/dev/tddoc/docs
                --javadoc build/docs/javadoc
                --name tddoc
                --tagline 'test-driven documentation: proven, not promised'
                --repo https://github.com/tddoc/tddoc
                --glyph '✓'
                --install 'jbang tddoc@tddoc --docs src/test/java/your/pkg/docs # or dev.tddoc:tddoc:{version} from Maven Central')
          for TAG in $TAGS; do
            V=${TAG#v}
            if [ "$TAG" = "$LATEST" ]; then PREFIX=""; OUT="$GITHUB_WORKSPACE/build/pages"; else PREFIX="v/$V/"; OUT="$GITHUB_WORKSPACE/build/pages/v/$V"; fi
            echo "::group::$TAG -> ${PREFIX:-<root>}"
            git worktree add "wt-$V" "$TAG"
            (cd "wt-$V" \
              && ./gradlew --no-daemon -q build javadoc \
              && java src/main/java/dev/tddoc/SiteGen.java "${ARGS[@]}" \
                   --out "$OUT" --version "$V" --prefix "$PREFIX" --channel "$V")
            git worktree remove --force "wt-$V"
            echo "::endgroup::"
          done
          echo "::group::main -> next/"
          ./gradlew --no-daemon -q build javadoc
          java src/main/java/dev/tddoc/SiteGen.java \
            --out build/pages/next --version "${LATEST#v}-next" --prefix "next/" --channel next
          echo "::endgroup::"
          {
            echo '{"entries":['
            echo "{\"path\":\"\",\"label\":\"${LATEST#v} (latest)\"},"
            for TAG in $TAGS; do
              [ "$TAG" = "$LATEST" ] && continue
              V=${TAG#v}
              echo "{\"path\":\"v/$V/\",\"label\":\"$V\"},"
            done
            echo '{"path":"next/","label":"next"}'
            echo ']}'
          } > build/pages/versions.json
          cat build/pages/versions.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages
      - uses: actions/deploy-pages@v4
        id: deploy
